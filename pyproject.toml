[project]
name = "whatsapp-genai-chat"
version = "0.1.0"
description = "Chat with an AI simulating a participant from a WhatsApp chat export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "azure-identity>=1.25.3",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.46.0",
    "whatsappchattodf>=0.1.3",
]
