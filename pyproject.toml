[project]
name = "whatsapp-genai-chat"
version = "0.1.0"
description = "Chat with an AI simulating a participant from a WhatsApp chat export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "azure-identity",
    "faiss-cpu",
    "fastapi",
    "google-generativeai",
    "numpy",
    "openai",
    "pandas",
    "pyclean>=3.6.0",
    "python-dotenv",
    "uvicorn[standard]",
    "whatsappchattodf>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
